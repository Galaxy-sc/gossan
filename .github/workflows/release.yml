name: Manual Windows Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build Release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p gossan

      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="gossan-windows-x86_64"
          mkdir -p "$stage"
          cp "target/x86_64-pc-windows-msvc/release/gossan.exe" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/" 2>/dev/null || true
          7z a -tzip "${stage}.zip" "$stage"
          echo "ASSET=${stage}.zip" >> "$GITHUB_ENV"

      - name: SHA-256 checksum
        shell: bash
        run: |
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          cat "${ASSET}.sha256"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossan-windows-x86_64
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
