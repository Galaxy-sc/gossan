name: Manual Windows Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Ensure missing rules directory & file exists
        shell: bash
        run: |
          mkdir -p crates/portscan/rules/cve
          touch crates/portscan/rules/cve/builtin.toml

      - name: Build Release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p gossan

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossan-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/gossan.exe
